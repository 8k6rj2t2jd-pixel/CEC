<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Entrar — Catálogo de Peças</title>
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" href="/favicon.png" type="image/png" />
<link rel="stylesheet" href="/style.css" />
<link rel="stylesheet" href="/login.css" />
</head>
<body>
<div class="login-wrap">
  <form class="login-card" id="login-form">
    <img id="logo-img" class="logo" src="/logo.png" alt="Centralinas &amp; Companhia" />
    <label>
      Utilizador
      <input id="username" name="username" autocomplete="username" required />
    </label>
    <label>
      Senha
      <span class="password-field">
        <input id="password" name="password" type="password" autocomplete="current-password" required />
        <button type="button" id="toggle-password" class="password-eye" aria-label="Mostrar senha" title="Mostrar senha"><svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </span>
    </label>
    <label class="remember-row">
      <input type="checkbox" id="remember-me" />
      <span>Relembra-me neste dispositivo</span>
    </label>
    <p class="remember-warning">Só deve usar isto no seu telemóvel ou computador pessoal — quem lhe pegar entra sem precisar da senha.</p>
    <button type="submit" class="btn btn-primary">Entrar</button>
    <p id="login-error" hidden><span aria-hidden="true"><svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/></svg></span> <span id="login-error-text"></span></p>
  </form>
</div>
<script src="/login.js"></script>
</body>
</html>
