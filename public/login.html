<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Entrar — Catálogo de Peças</title>
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" href="/favicon.png" type="image/png" />
<link rel="stylesheet" href="/style.css" />
<link rel="stylesheet" href="/login.css" />
</head>
<body>
<div class="login-wrap">
  <form class="login-card" id="login-form">
    <img id="logo-img" class="logo" src="/logo.png" alt="Centralinas &amp; Companhia" />
    <label>
      Utilizador
      <input id="username" name="username" autocomplete="username" required />
    </label>
    <label>
      Senha
      <span class="password-field">
        <input id="password" name="password" type="password" autocomplete="current-password" required />
        <button type="button" id="toggle-password" class="password-eye" aria-label="Mostrar senha" title="Mostrar senha">👁️</button>
      </span>
    </label>
    <label class="remember-row">
      <input type="checkbox" id="remember-me" />
      <span>Relembra-me neste dispositivo</span>
    </label>
    <button type="submit" class="btn btn-primary">Entrar</button>
    <p id="login-error" hidden><span aria-hidden="true">⚠️</span> <span id="login-error-text"></span></p>
  </form>
</div>
<script src="/login.js"></script>
</body>
</html>
