<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Entrar — Catálogo de Peças</title>
<link rel="stylesheet" href="/style.css" />
<style>
  body {
    background: #050505 url('/login-bg.svg') center center / cover no-repeat;
  }
  .login-wrap {
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .login-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 28px 24px; width: 100%; max-width: 340px;
    box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
  }
  .login-card h1 { font-size: 1.1rem; margin: 0 0 20px; text-align: center; }
  .login-card img.logo { display: block; margin: 0 auto 16px; max-height: 60px; }
  .login-card label { display: flex; flex-direction: column; gap: 6px; font-size: 0.85rem; color: var(--muted); margin-bottom: 14px; }
  .login-card input {
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    padding: 10px; border-radius: 8px; font-size: 0.95rem;
  }
  .login-card button { width: 100%; margin-top: 6px; }
  #login-error[hidden] { display: none; }
  #login-error {
    display: flex; align-items: center; gap: 8px;
    background: #fdecea; border: 1px solid #f1a9a0; color: #b3261e;
    border-radius: 8px; padding: 10px 12px; margin-top: 14px;
    font-size: 0.85rem; font-weight: 600;
  }
</style>
</head>
<body>
<div class="login-wrap">
  <form class="login-card" id="login-form">
    <img class="logo" src="/logo.png" alt="Centralinas &amp; Companhia" onerror="this.remove()" />
    <label>
      Utilizador
      <input id="username" name="username" autocomplete="username" required />
    </label>
    <label>
      Senha
      <input id="password" name="password" type="password" autocomplete="current-password" required />
    </label>
    <button type="submit" class="btn btn-primary">Entrar</button>
    <p id="login-error" hidden><span aria-hidden="true">⚠️</span> <span id="login-error-text"></span></p>
  </form>
</div>
<script>
  const form = document.getElementById('login-form');
  const errorEl = document.getElementById('login-error');
  const errorText = document.getElementById('login-error-text');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorEl.hidden = true;
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    try {
      const resp = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error || 'Utilizador ou senha incorretos.');
      window.location.href = '/';
    } catch (err) {
      errorText.textContent = err.message;
      errorEl.hidden = false;
    }
  });
</script>
</body>
</html>
